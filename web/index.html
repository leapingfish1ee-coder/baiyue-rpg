<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Baiyue RPG · 探索</title>
  </head>
  <body>
    <main id="game-app">
      <canvas id="world" aria-label="百岳探索地图"></canvas>

      <header class="game-header">
        <div>
          <span class="eyebrow">BAIYUE RPG</span>
          <h1>雾中远行</h1>
        </div>
        <div class="header-status">
          <span id="save-state" data-state="none">尚未建档</span>
          <button id="system-toggle" type="button" aria-expanded="false" aria-controls="system-panel">存档</button>
          <a id="debug-link" href="./world-debug.html" target="_blank" rel="noreferrer" hidden>Debug ↗</a>
        </div>
      </header>

      <section id="onboarding" class="surface onboarding" aria-labelledby="onboarding-title">
        <span class="eyebrow">新的旅程</span>
        <h2 id="onboarding-title">从一粒种子开始探索</h2>
        <p>世界只保存在这台设备。建档后，角色会从首个可站立位置出发。</p>
        <label for="world-seed">世界 Seed</label>
        <div class="seed-row">
          <input id="world-seed" inputmode="numeric" value="20260809" spellcheck="false" />
          <button id="create-world" class="primary" type="button">创建世界</button>
        </div>
        <p id="startup-message" class="message" aria-live="polite">正在连接本地世界…</p>
      </section>

      <aside id="journey-panel" class="surface journey-panel" hidden aria-label="探索状态">
        <div class="player-row">
          <span class="player-mark" aria-hidden="true"></span>
          <div>
            <strong>探索者</strong>
            <span id="player-position">—</span>
          </div>
          <span id="activity-state" class="activity-pill">空闲</span>
        </div>
        <div class="xp-block">
          <div><span id="level-label">探索 Lv.1</span><span id="xp-label">0 / 100 XP</span></div>
          <progress id="xp-progress" value="0" max="100"></progress>
        </div>
        <dl class="journey-stats">
          <div><dt>生命</dt><dd id="hp-label">100 / 100</dd></div>
          <div><dt>已揭露</dt><dd id="revealed-count">0 格</dd></div>
          <div><dt>观察半径</dt><dd id="radius-label">4 格</dd></div>
          <div><dt>预计抵达</dt><dd id="eta-label">—</dd></div>
        </dl>
      </aside>

      <section id="destination-card" class="surface destination-card" hidden aria-live="polite">
        <span class="eyebrow">目的地</span>
        <strong id="destination-label">tile 0, 0</strong>
        <div class="destination-fields">
          <label>Tile X<input id="destination-x" inputmode="numeric" value="0" /></label>
          <label>Tile Y<input id="destination-y" inputmode="numeric" value="0" /></label>
        </div>
        <div>
          <button id="destination-clear" type="button">取消选择</button>
          <button id="destination-confirm" class="primary" type="button">确认探索</button>
        </div>
      </section>

      <nav id="task-bar" class="surface task-bar" hidden aria-label="探索操作">
        <button id="explore-continuous" class="primary" type="button">
          <span>持续探索</span><small>寻找最近的未知边界</small>
        </button>
        <button id="choose-destination" type="button">
          <span>选择目的地</span><small>在地图上点选位置</small>
        </button>
        <button id="cancel-task" class="danger" type="button" hidden>
          <span>取消任务</span><small>停在当前位置</small>
        </button>
      </nav>

      <aside id="system-panel" class="surface system-panel" hidden aria-label="本地存档">
        <div class="panel-head"><strong>本地存档</strong><button id="system-close" type="button" aria-label="关闭">×</button></div>
        <p id="save-detail">所有进度仅保存在当前浏览器。</p>
        <div class="system-actions">
          <button id="export-save" type="button">导出备份</button>
          <button id="import-save" type="button">导入备份</button>
          <button id="reset-save" class="danger" type="button">重置存档</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <p id="system-message" class="message" aria-live="polite"></p>
      </aside>

      <aside id="offline-report" class="surface offline-report" hidden aria-live="polite">
        <button id="offline-close" type="button" aria-label="关闭">×</button>
        <span class="eyebrow">离线探索结算</span>
        <strong id="offline-title">旅程继续了</strong>
        <p id="offline-summary"></p>
      </aside>

      <div id="map-hint" hidden>点按地图选择目的地 · 拖拽平移 · 滚轮缩放</div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
