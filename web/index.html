<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Infinite TileMap Terrain MVP</title>
  </head>
  <body>
    <main id="app">
      <canvas id="world" aria-label="Infinite generated terrain"></canvas>
      <canvas id="water-effects" hidden aria-hidden="true"></canvas>
      <section id="hud">
        <div class="row">
          <label for="seed">Seed</label>
          <input id="seed" type="text" value="20260808" spellcheck="false" />
          <button id="apply-seed" type="button">应用</button>
          <label class="hud-toggle" for="grid-toggle">
            <input id="grid-toggle" type="checkbox" checked />
            <span>网格</span>
          </label>
          <label class="hud-toggle" for="base-color-toggle">
            <input id="base-color-toggle" type="checkbox" checked />
            <span>底色</span>
          </label>
          <label class="hud-toggle" for="water-shader-toggle">
            <input id="water-shader-toggle" type="checkbox" checked />
            <span>水面 Shader</span>
          </label>
          <button id="texture-tool-toggle" type="button" aria-expanded="false" aria-controls="texture-tool">纹理工具</button>
        </div>
        <div class="zoom-presets" role="group" aria-label="缩放快捷级数">
          <span>缩放</span>
          <button type="button" data-zoom="0.5" title="快捷键 1">50%</button>
          <button type="button" data-zoom="1" title="快捷键 2">100%</button>
          <button type="button" data-zoom="2" title="快捷键 3">200%</button>
          <button type="button" data-zoom="4" title="快捷键 4">400%</button>
        </div>
        <div class="stats">
          <span id="status">WASM 初始化中</span>
          <span id="position">tile 0, 0</span>
          <span id="chunks">0 chunks</span>
          <span id="zoom">100%</span>
        </div>
        <div class="hint">拖拽 / WASD 平移 · 滚轮缩放 · 1–4 快捷缩放 · G 切换网格 · 32px tile + 4px 间距</div>

        <details id="water-parameter-panel" class="shader-parameter-panel">
          <summary>水面参数</summary>
          <fieldset id="water-parameter-fields">
            <div class="shader-parameter-group">
              <strong>深水</strong>
              <label>
                <span>速度</span>
                <input id="water-deep-speed" type="range" min="0.02" max="0.8" step="0.01" value="0.18" />
                <output id="water-deep-speed-value" for="water-deep-speed">0.18×</output>
              </label>
              <label>
                <span>明暗强度</span>
                <input id="water-deep-color" type="range" min="0" max="0.6" step="0.01" value="0.15" />
                <output id="water-deep-color-value" for="water-deep-color">0.15</output>
              </label>
            </div>

            <div class="shader-parameter-group">
              <strong>浅水</strong>
              <label>
                <span>速度</span>
                <input id="water-shallow-speed" type="range" min="0.02" max="1" step="0.01" value="0.30" />
                <output id="water-shallow-speed-value" for="water-shallow-speed">0.30×</output>
              </label>
              <label>
                <span>明暗强度</span>
                <input id="water-shallow-color" type="range" min="0" max="0.6" step="0.01" value="0.22" />
                <output id="water-shallow-color-value" for="water-shallow-color">0.22</output>
              </label>
            </div>

            <div class="shader-parameter-group shader-parameter-group-wide">
              <strong>共享噪波</strong>
              <label>
                <span>颜色频率</span>
                <input id="water-color-frequency" type="range" min="0.005" max="0.15" step="0.005" value="0.045" />
                <output id="water-color-frequency-value" for="water-color-frequency">0.045</output>
              </label>
            </div>
            <div class="shader-parameter-actions">
              <button id="water-parameter-reset" type="button">恢复默认参数</button>
            </div>
          </fieldset>
        </details>
      </section>

      <aside id="texture-tool" hidden aria-label="Tile 纹理工具">
        <div class="texture-tool-head">
          <strong>Tile 纹理工具</strong>
          <button id="texture-tool-close" type="button">关闭</button>
        </div>
        <p class="texture-tool-note">上传 PNG / BMP / WebP。严格按 8×8 单元格从左到右、从上到下读取前 7 格，对应：深水、浅水、沙地、草地、森林、岩地、雪地。纹理格允许为空，不会自动复用其他格；地图底色可通过 HUD 的“底色”开关独立显示或隐藏。</p>
        <label class="texture-file-label" for="texture-file">选择 spritesheet</label>
        <input id="texture-file" type="file" accept="image/png,image/bmp,image/webp,image/*" />
        <div id="texture-preview" class="texture-preview" aria-label="地形纹理预览"></div>
        <div class="texture-tool-actions">
          <button id="texture-reset" type="button">恢复默认</button>
        </div>
        <div id="texture-status" class="texture-status" aria-live="polite">当前使用项目默认纹理：槽位 0 有纹理，其余槽位为空</div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
